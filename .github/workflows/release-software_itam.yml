name: Release software_itam

on:
  push:
    branches:
      - main
    paths:
      - 'software_itam/**'
  workflow_dispatch:

jobs:
  build-and-release:
    # CGO is off, so one Linux runner builds all six binaries.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: software_itam/go.sum

      - name: Test
        run: |
          cd software_itam
          make vet
          make test

      - name: Build binaries
        run: |
          cd software_itam
          make deps
          make build
          make checksums

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: software_itam-binaries
          path: |
            software_itam/software_itam-x86_64.ext
            software_itam/software_itam-arm64.ext
            software_itam/software_itam-amd64.ext
            software_itam/software_itam-linux-arm64.ext
            software_itam/software_itam-amd64.exe
            software_itam/software_itam-arm64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Fleet Extensions Release
          body: |
            This release includes updated binaries for the following extensions:

            | Extension                 | Built in this release |
            |---------------------------|----------------------|
            | software_itam             | ✅                    |

            See attached assets for binaries.
          files: |
            software_itam/software_itam-x86_64.ext
            software_itam/software_itam-arm64.ext
            software_itam/software_itam-amd64.ext
            software_itam/software_itam-linux-arm64.ext
            software_itam/software_itam-amd64.exe
            software_itam/software_itam-arm64.exe
          draft: false
          prerelease: false
